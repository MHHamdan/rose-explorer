name: Pages
# Publishes site/ (the landing page: the ROSE chain, the explorer gallery and the notebook chapters) to GitHub Pages.
# Enable once in the repository settings: Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", "app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: {group: pages, cancel-in-progress: true}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: The committed page is built from app/ and site/build_site.py
        run: python site/build_site.py --check
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
